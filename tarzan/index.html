<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ターザンロープシミュレーター</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f0fdf4; margin: 0; padding: 20px; color: #333; }
        h1 { font-size: 24px; margin-bottom: 10px; color: #166534; }
        
        .simulation-container { display: flex; flex-direction: column; gap: 15px; }
        canvas { background-color: #bae6fd; border: 2px solid #0284c7; border-radius: 8px; width: 100%; max-width: 1200px; height: 350px; display: block; cursor: pointer; }
        
        .env-info { background: white; padding: 12px 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); display: flex; gap: 20px; font-weight: bold; font-size: 15px; align-items: center; flex-wrap: wrap; }
        .env-item { display: flex; align-items: center; gap: 8px; }
        .badge { background: #e0f2fe; color: #0369a1; padding: 4px 10px; border-radius: 4px; border: 1px solid #7dd3fc; }

        .mode-section { background: #fef3c7; border: 2px solid #f59e0b; padding: 10px 15px; border-radius: 8px; display: flex; align-items: center; gap: 15px; font-size: 14px; }
        .angle-input-group { display: flex; align-items: center; gap: 8px; }
        .angle-input-group input[type="number"] { width: 80px; padding: 6px; font-size: 14px; border: 1px solid #cbd5e1; border-radius: 4px; text-align: right; }
        .btn-launch { background-color: #d97706; color: white; padding: 6px 15px; font-size: 14px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-launch:hover { background-color: #b45309; }

        .bottom-area { display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start; }
        .btn-group { display: flex; gap: 10px; }
        button { padding: 10px 20px; font-size: 14px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .btn-csv { background-color: #16a34a; color: white; }
        .btn-csv:hover { background-color: #15803d; }
        .btn-reset { background-color: #64748b; color: white; }
        .btn-reset:hover { background-color: #475569; }
        
        .table-container { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); width: 620px; max-height: 250px; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: center; }
        th, td { padding: 6px 8px; border: 1px solid #cbd5e1; }
        th { background-color: #f1f5f9; font-weight: bold; position: sticky; top: 0; }
        
        .desc-box { background: #f0fdf4; border-left: 4px solid #16a34a; padding: 10px 15px; border-radius: 4px; font-size: 13px; margin-bottom: 15px; }
    </style>
</head>
<body>

    <h1>🌴 ターザンロープシミュレーター</h1>
    
    <div class="desc-box">
        <strong>【使い方】</strong><br>
        1. <strong>通常モード:</strong> 画面クリックでスタートし、タイミングよくクリックしてジャンプ。<br>
        2. <strong>角度指定モード:</strong> 手放し角度を直接入力してジャンプ。
    </div>

    <div class="simulation-container">
        <div class="env-info">
            <div class="env-item">ロープ長 (X1): <span id="disp-rope" class="badge">- m</span></div>
            <div class="env-item">風速 (X2): <span id="disp-wind" class="badge">- m/s</span></div>
            <div class="env-item">🎯 島の位置: <span id="disp-island" class="badge" style="background:#fef3c7; color:#b45309; border-color:#fcd34d;">- m</span></div>
            
            <div class="mode-section">
                <label style="cursor: pointer; display: flex; align-items: center; gap: 5px;">
                    <input type="checkbox" id="chk-auto-mode" onchange="toggleMode()">
                    🎯 角度を指定して飛ばす（検証モード）
                </label>

                <div id="input-container" class="angle-input-group" style="display: none;">
                    手放し角度 (X3): 
                    <input type="number" id="input-target-angle" placeholder="30.0" step="0.1" min="-70" max="70"> °
                    <button class="btn-launch" onclick="launchWithAngle()">計算結果で発射！</button>
                </div>
            </div>
        </div>

        <canvas id="canvas" width="1200" height="350"></canvas>
        
        <div class="bottom-area">
            <div class="btn-group">
                <button class="btn-csv" onclick="downloadCSV()">CSV出力</button>
                <button class="btn-reset" onclick="resetData()">はじめから</button>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>試行</th>
                            <th>ロープ長(X1)</th>
                            <th>風速(X2)</th>
                            <th>離した角度(X3)</th>
                            <th>到達距離(Y)</th>
                        </tr>
                    </thead>
                    <tbody id="data-table">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let trialCount = 0;
        let historyData = [];

        // 物理・スケール定数（変更なし）
        const pivotX = 100;
        const pivotY = 50;
        const groundY = 320;
        const SCALE = 5.5; 
        const DT = 0.05;

        let ropeLengthM = 10;
        let windSpeed = 0;
        
        // 島の位置情報 (メートル単位)
        let islandStartM = 120;
        let islandWidthM = 16;

        const INITIAL_ANGLE_RAD = 75 * (Math.PI / 180);
        let gameState = 'IDLE'; 
        let angle = INITIAL_ANGLE_RAD;
        let angleVel = 0;

        let posX = 0, posY = 0;
        let velX = 0, velY = 0;
        let releaseAngleDeg = 0;

        let isTargetAngleMode = false;
        let targetAngleRad = 0;

        // 演出用の変数
        let splashRadius = 0;
        let splashAlpha = 0;

        function initTrial() {
            gameState = 'IDLE';
            ropeLengthM = parseFloat((Math.random() * 6 + 8).toFixed(1));
            windSpeed = parseFloat((Math.random() * 10 - 5).toFixed(1));

            // 島を 100m 〜 150m の間のどこかに配置
            islandStartM = Math.floor(Math.random() * 51) + 100; 
            islandWidthM = 16;

            document.getElementById('disp-rope').innerText = `${ropeLengthM} m`;
            document.getElementById('disp-wind').innerText = `${windSpeed > 0 ? '+' : ''}${windSpeed} m/s`;
            document.getElementById('disp-island').innerText = `${islandStartM}m 〜 ${islandStartM + islandWidthM}m`;

            angle = INITIAL_ANGLE_RAD; 
            angleVel = 0;
            splashRadius = 0;
            splashAlpha = 0;

            draw();
        }

        function toggleMode() {
            const chk = document.getElementById('chk-auto-mode');
            const inputContainer = document.getElementById('input-container');
            if (chk.checked) {
                inputContainer.style.display = 'flex';
            } else {
                inputContainer.style.display = 'none';
            }
        }

        canvas.addEventListener('click', () => {
            if (document.getElementById('chk-auto-mode').checked && gameState === 'SWINGING') {
                return;
            }

            if (gameState === 'IDLE') {
                gameState = 'SWINGING';
            } else if (gameState === 'SWINGING') {
                releaseRope();
            } else if (gameState === 'LANDED') {
                initTrial();
            }
        });

        function launchWithAngle() {
            const inputVal = parseFloat(document.getElementById('input-target-angle').value);
            if (isNaN(inputVal)) {
                alert('角度を数値で入力してください。');
                return;
            }

            if (inputVal < -70 || inputVal > 70) {
                alert('手放し角度は -70° から 70° の範囲で指定してください。');
                return;
            }

            if (gameState === 'LANDED') {
                initTrial();
            }

            isTargetAngleMode = true;
            targetAngleRad = inputVal * (Math.PI / 180);
            gameState = 'SWINGING';
        }

        function releaseRope() {
            gameState = 'FLYING';
            
            posX = ropeLengthM * Math.sin(angle);
            posY = ropeLengthM * Math.cos(angle);

            const speed = angleVel * ropeLengthM * 18.0;
            
            velX = speed * Math.cos(angle);
            velY = -speed * Math.sin(angle);

            releaseAngleDeg = (angle * (180 / Math.PI)).toFixed(1);
            isTargetAngleMode = false;
        }

        function update() {
            if (gameState === 'SWINGING') {
                const g = 9.8;
                let angleAccel = -(g / ropeLengthM) * Math.sin(angle);
                
                angleVel += angleAccel * 0.015;
                angle += angleVel;

                if (isTargetAngleMode) {
                    if (angleVel > 0 && angle >= targetAngleRad) {
                        angle = targetAngleRad;
                        releaseRope();
                    }
                }

            } else if (gameState === 'FLYING') {
                const g = 4.5;
                const windEffect = (windSpeed * 0.15);
                
                velX += windEffect * DT;
                velY += g * DT;

                posX += velX * DT;
                posY += velY * DT;

                const groundDistM = (groundY - pivotY) / SCALE;
                if (posY >= groundDistM) {
                    posY = groundDistM;
                    gameState = 'LANDED';
                    
                    if (!isLandedOnIsland()) {
                        splashRadius = 5;
                        splashAlpha = 1.0;
                    }
                    
                    recordResult();
                }
            } else if (gameState === 'LANDED') {
                if (splashAlpha > 0) {
                    splashRadius += 1.5;
                    splashAlpha -= 0.04;
                }
            }
        }

        function isLandedOnIsland() {
            const finalDist = Math.max(0, posX);
            return (finalDist <= 15) || (finalDist >= islandStartM && finalDist <= islandStartM + islandWidthM);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. 海
            ctx.fillStyle = '#38bdf8';
            ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

            // 2. スタート地点の陸地 (0m〜15m)
            const startLandPx = pivotX + 15 * SCALE;
            ctx.fillStyle = '#86efac';
            ctx.fillRect(0, groundY, startLandPx, canvas.height - groundY);
            ctx.strokeStyle = '#16a34a';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, groundY);
            ctx.lineTo(startLandPx, groundY);
            ctx.stroke();

            // 3. 島（ターゲット）の描画
            const islandPx = pivotX + islandStartM * SCALE;
            const islandWidthPx = islandWidthM * SCALE;
            
            // 砂浜
            ctx.fillStyle = '#fef08a';
            ctx.fillRect(islandPx - 3, groundY, islandWidthPx + 6, canvas.height - groundY);
            // 草地
            ctx.fillStyle = '#4ade80';
            ctx.fillRect(islandPx, groundY, islandWidthPx, canvas.height - groundY);
            ctx.strokeStyle = '#15803d';
            ctx.beginPath();
            ctx.moveTo(islandPx, groundY);
            ctx.lineTo(islandPx + islandWidthPx, groundY);
            ctx.stroke();

            // 4. 目盛り
            ctx.fillStyle = '#0f172a';
            ctx.font = '11px sans-serif';
            for (let m = 0; m <= 200; m += 10) {
                let x = pivotX + m * SCALE;
                if (x > canvas.width) break;
                
                ctx.beginPath();
                ctx.moveTo(x, groundY);
                ctx.lineTo(x, groundY + (m % 20 === 0 ? 8 : 4));
                ctx.strokeStyle = '#0284c7';
                ctx.stroke();
                if (m % 20 === 0) {
                    ctx.fillText(`${m}m`, x - 10, groundY + 22);
                }
            }

            // 支点
            ctx.fillStyle = '#334155';
            ctx.fillRect(pivotX - 10, pivotY - 10, 20, 10);

            let drawPx, drawPy;
            if (gameState === 'SWINGING' || gameState === 'IDLE') {
                drawPx = pivotX + (ropeLengthM * Math.sin(angle)) * SCALE;
                drawPy = pivotY + (ropeLengthM * Math.cos(angle)) * SCALE;

                ctx.strokeStyle = '#78350f';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(pivotX, pivotY);
                ctx.lineTo(drawPx, drawPy);
                ctx.stroke();
            } else {
                drawPx = pivotX + posX * SCALE;
                drawPy = pivotY + posY * SCALE;
            }

            // 水しぶき
            if (gameState === 'LANDED' && !isLandedOnIsland() && splashAlpha > 0) {
                ctx.save();
                ctx.strokeStyle = `rgba(255, 255, 255, ${splashAlpha})`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.ellipse(drawPx, groundY + 5, splashRadius * 1.5, splashRadius * 0.5, 0, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            }

            // ターザン
            let charY = drawPy;
            if (gameState === 'LANDED' && !isLandedOnIsland()) {
                charY = groundY + 6;
            }

            ctx.beginPath();
            ctx.arc(drawPx, charY, 10, 0, Math.PI * 2);
            ctx.fillStyle = '#ea580c';
            ctx.fill();
            ctx.strokeStyle = '#431407';
            ctx.lineWidth = 2;
            ctx.stroke();

            // UIテキスト
            ctx.fillStyle = '#0f172a';
            ctx.font = 'bold 15px sans-serif';
            const isAuto = document.getElementById('chk-auto-mode').checked;

            if (gameState === 'IDLE') {
                ctx.fillText(isAuto ? '角度を入力して「計算結果で発射！」を押してください' : 'クリックで揺れ始めます', pivotX + 30, pivotY + 40);
            } else if (gameState === 'SWINGING') {
                if (!isAuto) {
                    ctx.fillText('クリックで手を離す！', drawPx + 15, drawPy);
                }
            } else if (gameState === 'LANDED') {
                if (isLandedOnIsland()) {
                    ctx.fillStyle = '#16a34a';
                    ctx.font = 'bold 22px sans-serif';
                    ctx.fillText('🎉 Congratulations!', drawPx - 80, drawPy - 30);
                }
            }
        }

        function recordResult() {
            trialCount++;
            const finalDistanceM = Math.max(0, posX).toFixed(2);

            const record = {
                trial: trialCount,
                rope: ropeLengthM,
                wind: windSpeed,
                angle: releaseAngleDeg,
                distance: finalDistanceM
            };
            historyData.push(record);

            const tbody = document.getElementById('data-table');
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${record.trial}</td>
                <td>${record.rope}</td>
                <td>${record.wind}</td>
                <td>${record.angle}°</td>
                <td><strong>${record.distance}</strong></td>
            `;
            tbody.insertBefore(tr, tbody.firstChild);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        function resetData() {
            trialCount = 0;
            historyData = [];
            document.getElementById('data-table').innerHTML = '';
            initTrial();
        }

        // ★ CSV出力処理のみ文字化け対策版に差し替え
        function downloadCSV() {
            if (historyData.length === 0) {
                alert('データがありません。');
                return;
            }

            let csvContent = "\uFEFF";
            csvContent += "試行,ロープ長(X1),風速(X2),手放し角度(X3),到達距離(Y)\n";

            historyData.forEach(row => {
                csvContent += `${row.trial},${row.rope},${row.wind},${row.angle},${row.distance}\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", "tarzan_rope_data.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        initTrial();
        loop();
    </script>
</body>
</html>
