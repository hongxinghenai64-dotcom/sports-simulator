<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ターザンロープシミュレーター</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f0fdf4; margin: 0; padding: 20px; color: #333; }
        h1 { font-size: 24px; margin-bottom: 10px; color: #166534; }
        
        .simulation-container { display: flex; flex-direction: column; gap: 15px; }
        canvas { background-color: #bae6fd; border: 2px solid #0284c7; border-radius: 8px; width: 100%; max-width: 1200px; height: 350px; display: block; cursor: pointer; }
        
        .env-info { background: white; padding: 12px 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); display: flex; gap: 30px; font-weight: bold; font-size: 15px; align-items: center; }
        .env-item { display: flex; align-items: center; gap: 8px; }
        .badge { background: #e0f2fe; color: #0369a1; padding: 4px 10px; border-radius: 4px; border: 1px solid #7dd3fc; }

        .bottom-area { display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start; }
        .btn-group { display: flex; gap: 10px; }
        button { padding: 10px 20px; font-size: 14px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .btn-csv { background-color: #16a34a; color: white; }
        .btn-csv:hover { background-color: #15803d; }
        .btn-reset { background-color: #64748b; color: white; }
        .btn-reset:hover { background-color: #475569; }
        
        .table-container { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); width: 620px; max-height: 250px; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: center; }
        th, td { padding: 6px 8px; border: 1px solid #cbd5e1; }
        th { background-color: #f1f5f9; font-weight: bold; position: sticky; top: 0; }
        
        .desc-box { background: #f0fdf4; border-left: 4px solid #16a34a; padding: 10px 15px; border-radius: 4px; font-size: 13px; margin-bottom: 15px; }
    </style>
</head>
<body>

    <h1>🌴 ターザンロープシミュレーター（重回帰分析用）</h1>
    
    <div class="desc-box">
        <strong>【遊び方】</strong><br>
        1. 画面（キャンバス）をクリックすると振り子が揺れ始めます。<br>
        2. タイミングよくクリックしてロープを離し、遠くまで飛びましょう！<br>
        3. 試行ごとに「ロープの長さ」と「風速」がランダムに変化します。
    </div>

    <div class="simulation-container">
        <!-- 現在の環境条件を表示 -->
        <div class="env-info">
            <div class="env-item">ロープ長 ($X_1$): <span id="disp-rope" class="badge">- m</span></div>
            <div class="env-item">風速 ($X_2$): <span id="disp-wind" class="badge">- m/s</span></div>
            <div class="env-item" style="color: #166534;">※クリックでスタート／ジャンプ！</div>
        </div>

        <canvas id="canvas" width="1200" height="350"></canvas>
        
        <div class="bottom-area">
            <div class="btn-group">
                <button class="btn-csv" onclick="downloadCSV()">CSV出力</button>
                <button class="btn-reset" onclick="resetData()">はじめから</button>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>試行</th>
                            <th>ロープ長($X_1$)</th>
                            <th>風速($X_2$)</th>
                            <th>離した角度($X_3$)</th>
                            <th>到達距離($Y$)</th>
                        </tr>
                    </thead>
                    <tbody id="data-table">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let trialCount = 0;
        let historyData = [];

        // 物理・スケール定数
        const pivotX = 150;
        const pivotY = 50;
        const groundY = 320;
        const SCALE = 12; // 1メートル = 12ピクセル
        const DT = 0.05;   // タイムステップ

        // 試行ごとの環境変数
        let ropeLengthM = 10;
        let windSpeed = 0;
        
        // 振り子状態
        let gameState = 'IDLE'; 
        let angle = Math.PI / 3; // 60度からスタート
        let angleVel = 0;

        // 飛行状態
        let posX = 0, posY = 0;
        let velX = 0, velY = 0;
        let releaseAngleDeg = 0;

        function initTrial() {
            gameState = 'IDLE';
            ropeLengthM = parseFloat((Math.random() * 6 + 8).toFixed(1)); // 8.0 ~ 14.0m
            windSpeed = parseFloat((Math.random() * 10 - 5).toFixed(1));   // -5.0 ~ +5.0m/s

            document.getElementById('disp-rope').innerText = `${ropeLengthM} m`;
            document.getElementById('disp-wind').innerText = `${windSpeed > 0 ? '+' : ''}${windSpeed} m/s`;

            angle = Math.PI / 3; 
            angleVel = 0;

            draw();
        }

        canvas.addEventListener('click', () => {
            if (gameState === 'IDLE') {
                gameState = 'SWINGING';
            } else if (gameState === 'SWINGING') {
                gameState = 'FLYING';
                
                // 離した瞬間の位置（メートル単位）
                const relX = ropeLengthM * Math.sin(angle);
                const relY = ropeLengthM * Math.cos(angle);
                
                posX = relX;
                posY = relY;

                // 速度（適正な飛び感になるよう倍率を調整）
                const tangentialSpeed = ropeLengthM * angleVel * 1.8;
                
                velX = tangentialSpeed * Math.cos(angle);
                velY = -tangentialSpeed * Math.sin(angle);

                // 手放し角度（度数法）
                releaseAngleDeg = (angle * (180 / Math.PI)).toFixed(1);
            } else if (gameState === 'LANDED') {
                initTrial();
            }
        });

        function update() {
            if (gameState === 'SWINGING') {
                // 振り子の単振子方程式（適度なスピード感：係数 0.02）
                const g = 9.8;
                let angleAccel = -(g / ropeLengthM) * Math.sin(angle);
                
                angleVel += angleAccel * 0.02;
                angle += angleVel;

            } else if (gameState === 'FLYING') {
                // 重力を少しマイルドにして滞空時間を確保 (3.5 m/s^2 相当の感覚)
                const g = 3.5;
                const windEffect = (windSpeed - velX) * 0.08;
                
                velX += windEffect * DT;
                velY += g * DT;

                posX += velX * DT;
                posY += velY * DT;

                // 地面判定
                const groundDistM = (groundY - pivotY) / SCALE;
                if (posY >= groundDistM) {
                    posY = groundDistM;
                    gameState = 'LANDED';
                    recordResult();
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 地面
            ctx.fillStyle = '#86efac';
            ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
            ctx.strokeStyle = '#16a34a';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, groundY);
            ctx.lineTo(canvas.width, groundY);
            ctx.stroke();

            // 目盛り (10m刻み)
            ctx.fillStyle = '#15803d';
            ctx.font = '11px sans-serif';
            for (let m = 0; m <= 80; m += 5) {
                let x = pivotX + m * SCALE;
                ctx.beginPath();
                ctx.moveTo(x, groundY);
                ctx.lineTo(x, groundY + 8);
                ctx.stroke();
                if (m % 10 === 0) {
                    ctx.fillText(`${m}m`, x - 8, groundY + 22);
                }
            }

            // 支点
            ctx.fillStyle = '#334155';
            ctx.fillRect(pivotX - 10, pivotY - 10, 20, 10);

            // 描画ピクセル座標の計算
            let drawPx, drawPy;
            if (gameState === 'SWINGING' || gameState === 'IDLE') {
                drawPx = pivotX + (ropeLengthM * Math.sin(angle)) * SCALE;
                drawPy = pivotY + (ropeLengthM * Math.cos(angle)) * SCALE;

                // ロープ
                ctx.strokeStyle = '#78350f';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(pivotX, pivotY);
                ctx.lineTo(drawPx, drawPy);
                ctx.stroke();
            } else {
                drawPx = pivotX + posX * SCALE;
                drawPy = pivotY + posY * SCALE;
            }

            // ターザン本体
            ctx.beginPath();
            ctx.arc(drawPx, drawPy, 10, 0, Math.PI * 2);
            ctx.fillStyle = '#ea580c';
            ctx.fill();
            ctx.strokeStyle = '#431407';
            ctx.lineWidth = 2;
            ctx.stroke();

            // UIテキスト
            ctx.fillStyle = '#0f172a';
            ctx.font = 'bold 15px sans-serif';
            if (gameState === 'IDLE') {
                ctx.fillText('クリックで揺れ始めます', pivotX + 30, pivotY + 40);
            } else if (gameState === 'SWINGING') {
                ctx.fillText('クリックで手を離す！', drawPx + 15, drawPy);
            } else if (gameState === 'LANDED') {
                const distanceM = Math.max(0, posX).toFixed(2);
                ctx.fillStyle = '#dc2626';
                ctx.fillText(`到達距離: ${distanceM} m (クリックで次へ)`, drawPx - 60, drawPy - 20);
            }
        }

        function recordResult() {
            trialCount++;
            const finalDistanceM = Math.max(0, posX).toFixed(2);

            const record = {
                trial: trialCount,
                rope: ropeLengthM,
                wind: windSpeed,
                angle: releaseAngleDeg,
                distance: finalDistanceM
            };
            historyData.push(record);

            const tbody = document.getElementById('data-table');
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${record.trial}</td>
                <td>${record.rope}</td>
                <td>${record.wind}</td>
                <td>${record.angle}°</td>
                <td><strong>${record.distance}</strong></td>
            `;
            tbody.insertBefore(tr, tbody.firstChild);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        function resetData() {
            trialCount = 0;
            historyData = [];
            document.getElementById('data-table').innerHTML = '';
            initTrial();
        }

        function downloadCSV() {
            if (historyData.length === 0) {
                alert('データがありません。');
                return;
            }

            let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
            csvContent += "試行,ロープ長(X1),風速(X2),手放し角度(X3),到達距離(Y)\n";

            historyData.forEach(row => {
                csvContent += `${row.trial},${row.rope},${row.wind},${row.angle},${row.distance}\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "tarzan_rope_data.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        initTrial();
        loop();
    </script>
</body>
</html>
