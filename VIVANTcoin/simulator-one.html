<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>コイン投擲シミュレーター</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f0f4f8; margin: 0; padding: 20px; color: #333; }
        h1 { font-size: 24px; margin-bottom: 10px; color: #1e3a8a; }
        
        .top-controls { background: white; padding: 15px 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 15px; display: flex; flex-wrap: wrap; gap: 15px 20px; align-items: center; }
        .control-item { display: flex; align-items: center; gap: 8px; }
        .control-item label { font-weight: bold; font-size: 13px; cursor: pointer; }
        .val-box { width: 65px; text-align: center; border: 1px solid #ccc; border-radius: 4px; padding: 3px; font-weight: bold; background: #f8fafc; font-size: 13px; }
        
        .simulation-container { display: flex; flex-direction: column; gap: 15px; }
        
        /* カーソルを黒色の明確なクロスヘア(SVG)に変更 */
        canvas { 
            background-color: #a5b4fc; 
            border: 2px solid #6366f1; 
            border-radius: 8px; 
            width: 100%; 
            max-width: 1200px; 
            height: 260px; 
            display: block; 
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="%230f172a" stroke-width="2"><line x1="12" y1="2" x2="12" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/></svg>') 12 12, crosshair; 
        }
        
        .bottom-area { display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start; }
        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        button { padding: 10px 16px; font-size: 13px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .btn-auto { background-color: #10b981; color: white; }
        .btn-auto:hover { background-color: #059669; }
        .btn-reset { background-color: #ef4444; color: white; }
        .btn-reset:hover { background-color: #dc2626; }
        
        .auto-box { display: flex; align-items: center; gap: 8px; background: #ecfdf5; border: 1px solid #a7f3d0; padding: 6px 12px; border-radius: 6px; }
        
        .disabled-input { opacity: 0.3; pointer-events: none; }
    </style>
</head>
<body>

    <h1>🥌 コイン射撃シミュレーター（学芸大学付属国際中等）</h1>

    <!-- 設定パネル（引き量制限のみ表示） -->
    <div class="top-controls">
        <div class="control-item">
            <input type="checkbox" id="chk-force" onchange="toggleParam('force')">
            <label for="chk-force">引き量制限(mm)</label>
            <input type="range" id="param-force" min="40" max="160" value="120" oninput="updateVal('force')" class="disabled-input">
            <span id="val-force" class="val-box disabled-input">-</span>
        </div>
    </div>

    <div class="simulation-container">
        <canvas id="canvas" width="1200" height="260"></canvas>
        
        <div class="bottom-area">
            <div class="btn-group">
                <div class="auto-box">
                    <label for="auto-count" style="font-weight:bold; font-size:12px;">⚡ 自動試行回数:</label>
                    <input type="range" id="auto-count" min="20" max="200" value="50" step="10" oninput="document.getElementById('val-auto-count').innerText = this.value + '回'">
                    <span id="val-auto-count" style="font-weight:bold; font-size:12px; width:45px;">50回</span>
                    <button class="btn-auto" id="btn-run-auto" onclick="runAutoSimulation()">自動実行</button>
                </div>
                <button class="btn-reset" onclick="resetData()">はじめから</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let trialCount = 0;
        let historyData = [];
        let stoneHits = [];
        
        // メンタル・状態管理用変数
        let currentHeartRate = 60;
        let currentStreak = 0;
        let lastResult = '成功';

        const launcher = { x: 20, y: 50, width: 130, height: 160, stoneRadius: 10, restX: 130, restY: 130 };
        const MAX_DISTANCE_MM = 2300;
        const RINK_END_X = 1180;

        let isDragging = false;
        let dragX = launcher.restX;
        let dragY = launcher.restY;
        let isAnimating = false;

        const weatherList = ['晴れ', '曇り', '雨', '雪'];
        const coinConditionList = ['ピカピカ（新硬貨）', 'やや汚れ', '黒ずみ（古硬貨）'];
        const paramList = ['force', 'angle', 'guide', 'temp', 'humidity', 'weight', 'fric', 'heartRate'];

        function calcPowerFromDx(dx) { return Math.round(dx * 1.6); }
        function calcLimitXFromPower(power) { return launcher.restX - (power / 1.6); }

        function updateVal(param) {
            const chk = document.getElementById(`chk-${param}`);
            const el = document.getElementById(`param-${param}`);
            const valBox = document.getElementById(`val-${param}`);

            if (!chk || !chk.checked) {
                if (valBox) valBox.innerText = "-";
                return;
            }

            let unit = "";
            if(param === 'force') unit = "mm";
            
            if (valBox) valBox.innerText = el.value + unit;
            drawRink();
        }

        function toggleParam(param) {
            const chk = document.getElementById(`chk-${param}`);
            if (!chk) return;

            if (chk.checked) {
                paramList.forEach(p => {
                    if (p !== param) {
                        const otherChk = document.getElementById(`chk-${p}`);
                        const otherInput = document.getElementById(`param-${p}`);
                        const otherValBox = document.getElementById(`val-${p}`);
                        if (otherChk) otherChk.checked = false;
                        if (otherInput) otherInput.classList.add('disabled-input');
                        if (otherValBox) {
                            otherValBox.classList.add('disabled-input');
                            otherValBox.innerText = "-";
                        }
                    }
                });
            }

            const input = document.getElementById(`param-${param}`);
            const valBox = document.getElementById(`val-${param}`);
            
            if (chk.checked) {
                if (input) input.classList.remove('disabled-input');
                if (valBox) valBox.classList.remove('disabled-input');
                updateVal(param);
            } else {
                if (input) input.classList.add('disabled-input');
                if (valBox) {
                    valBox.classList.add('disabled-input');
                    valBox.innerText = "-";
                }
            }
            drawRink();
        }

        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: (e.clientX - rect.left) * (canvas.width / rect.width),
                y: (e.clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        canvas.addEventListener('mousedown', (e) => {
            if (isAnimating) return;
            const mousePos = getMousePos(e);
            if (Math.hypot(mousePos.x - launcher.restX, mousePos.y - launcher.restY) < 25) {
                isDragging = true;
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDragging || isAnimating) return;
            const mousePos = getMousePos(e);

            let minX = launcher.x + 10;
            const chkForce = document.getElementById('chk-force');
            if (chkForce && chkForce.checked) {
                minX = Math.max(minX, calcLimitXFromPower(parseFloat(document.getElementById('param-force').value)));
            }

            dragX = Math.min(launcher.restX, Math.max(minX, mousePos.x));

            const chkAngle = document.getElementById('chk-angle');
            if (chkAngle && chkAngle.checked) {
                const angleDeg = parseFloat(document.getElementById('param-angle').value);
                const angleRad = (angleDeg * Math.PI) / 180;
                const dx = launcher.restX - dragX;
                dragY = launcher.restY - (dx * Math.tan(angleRad));
            } else {
                const chkGuide = document.getElementById('chk-guide');
                const isGuide = chkGuide ? chkGuide.checked : false;
                const guideVal = isGuide ? parseFloat(document.getElementById('param-guide').value) : 35;
                const maxYSpread = (guideVal - 1) / 49 * 60; 
                dragY = Math.min(launcher.restY + maxYSpread, Math.max(launcher.restY - maxYSpread, mousePos.y));
            }

            drawRink();
        });

        window.addEventListener('mouseup', () => {
            if (isDragging) {
                isDragging = false;
                shootStone();
            }
        });

        function getXFromDistance(mm) { return launcher.restX + (mm * ((RINK_END_X - launcher.restX) / MAX_DISTANCE_MM)); }
        function getDistanceFromX(x) { return x < launcher.restX ? 0 : (x - launcher.restX) * (MAX_DISTANCE_MM / (RINK_END_X - launcher.restX)); }
        function getActualDistance(x, y) {
            const pxPerMM = (RINK_END_X - launcher.restX) / MAX_DISTANCE_MM;
            return Math.hypot(x - launcher.restX, y - launcher.restY) / pxPerMM;
        }

        function drawRink() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#a5b4fc';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 目盛り
            ctx.strokeStyle = '#475569';
            ctx.fillStyle = '#0f172a';
            ctx.font = 'bold 11px sans-serif';
            for (let mm = 100; mm <= MAX_DISTANCE_MM; mm += 100) {
                const x = getXFromDistance(mm);
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
                if (mm % 200 === 0 || mm === 100) ctx.fillText(mm, x - 12, 15);
            }

            // 帯状の目標エリア（1,600mm 〜 1,800mm）
            const targetStartX = getXFromDistance(1600);
            const targetEndX = getXFromDistance(1800);
            const targetWidth = targetEndX - targetStartX;

            ctx.fillStyle = 'rgba(239, 68, 68, 0.4)'; // 赤色の半透明
            ctx.fillRect(targetStartX, 0, targetWidth, canvas.height);

            // 帯の境界線
            ctx.strokeStyle = '#ef4444';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(targetStartX, 0); ctx.lineTo(targetStartX, canvas.height); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(targetEndX, 0); ctx.lineTo(targetEndX, canvas.height); ctx.stroke();

            // 分度器（角度目盛）
            ctx.save();
            ctx.font = '10px sans-serif';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            const protractorRadius = 110;
            const angles = [-30, -20, -10, 0, 10, 20, 30];

            angles.forEach(deg => {
                const rad = (deg * Math.PI) / 180;
                const endX = launcher.restX + protractorRadius * Math.cos(rad);
                const endY = launcher.restY + protractorRadius * Math.sin(rad);

                ctx.beginPath();
                ctx.moveTo(launcher.restX, launcher.restY);
                ctx.lineTo(endX, endY);
                ctx.strokeStyle = (deg === 0) ? 'rgba(30, 58, 138, 0.6)' : 'rgba(71, 85, 105, 0.35)';
                ctx.lineWidth = (deg === 0) ? 1.5 : 1;
                if (deg !== 0) ctx.setLineDash([3, 3]);
                else ctx.setLineDash([]);
                ctx.stroke();

                const labelX = launcher.restX + (protractorRadius + 10) * Math.cos(rad);
                const labelY = launcher.restY + (protractorRadius + 10) * Math.sin(rad);
                ctx.fillStyle = '#1e293b';
                ctx.fillText(`${deg}°`, labelX, labelY);
            });
            ctx.restore();

            // 発射台
            ctx.fillStyle = '#cbd5e1'; ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.roundRect(launcher.x, launcher.y, launcher.width, launcher.height, 15); ctx.fill(); ctx.stroke();

            const chkForce = document.getElementById('chk-force');
            if (chkForce && chkForce.checked) {
                const limitX = calcLimitXFromPower(parseFloat(document.getElementById('param-force').value));
                ctx.strokeStyle = '#dc2626'; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.moveTo(limitX, launcher.y + 5); ctx.lineTo(limitX, launcher.y + launcher.height - 5); ctx.stroke();
            }

            // コイン
            if (!isAnimating) {
                if (isDragging) {
                    ctx.strokeStyle = '#d97706'; ctx.lineWidth = 3;
                    ctx.beginPath(); ctx.moveTo(launcher.restX, launcher.restY); ctx.lineTo(dragX, dragY); ctx.stroke();
                }
                ctx.beginPath(); ctx.arc(dragX, dragY, launcher.stoneRadius, 0, Math.PI * 2);
                ctx.fillStyle = '#334155'; ctx.fill(); ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 2; ctx.stroke();
            }

            // 履歴（着弾点）
            stoneHits.forEach(stone => {
                if (stone.x <= canvas.width && stone.y >= 0 && stone.y <= canvas.height) {
                    ctx.beginPath(); ctx.arc(stone.x, stone.y, 8, 0, Math.PI * 2);
                    const isHitBand = (stone.x >= targetStartX && stone.x <= targetEndX);
                    ctx.fillStyle = isHitBand ? '#ef4444' : '#1e293b';
                    ctx.fill(); ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 1.5; ctx.stroke();
                }
            });
        }

        function shootStone(overrideDx = null, overrideDy = null, isFast = false) {
            isAnimating = true;

            const currentCondition = coinConditionList[Math.floor(Math.random() * coinConditionList.length)];
            const noise = Math.floor(Math.random() * 41) + 40;
            const currentWeather = weatherList[Math.floor(Math.random() * weatherList.length)];

            let humidity = 50;
            if (currentWeather === '雨') humidity = Math.floor(Math.random() * 16) + 75;
            else if (currentWeather === '雪') humidity = Math.floor(Math.random() * 21) + 60;
            else if (currentWeather === '晴れ') humidity = Math.floor(Math.random() * 21) + 30;
            else humidity = Math.floor(Math.random() * 21) + 45;

            let weight = parseFloat((Math.random() * 9.0 + 1.0).toFixed(1));
            const temp = Math.floor(Math.random() * 11) + 10;

            // 基本摩擦が 0.0300 ～ 0.0303 に収まるように調整
            let conditionFrictionAdd = 0;
            if (currentCondition === 'やや汚れ') conditionFrictionAdd = 0.00008;
            if (currentCondition === '黒ずみ（古硬貨）') conditionFrictionAdd = 0.00015;

            // 基本摩擦係数の計算 (目標: 0.0300 ～ 0.0303)
            let baseFriction = 0.03002 - (temp * 0.000002) + (weight * 0.000015) + conditionFrictionAdd;
            baseFriction = Math.max(0.0300, Math.min(0.0303, baseFriction));

            // カオス（毎フレームの微小揺らぎ）±0.001 に変更
            const frictionNoise = (Math.random() * 0.002) - 0.001;
            let actualFriction = Math.max(0.001, baseFriction + frictionNoise);

            const dx = overrideDx !== null ? overrideDx : (launcher.restX - dragX);
            let dy = overrideDy !== null ? overrideDy : (dragY - launcher.restY);
            const actualPower = calcPowerFromDx(dx);

            const targetHR = 60;
            let hrDiff = targetHR - currentHeartRate;
            let change = hrDiff * 0.1 + (lastResult === '失敗' ? (Math.random() * 2 + 1) : -(Math.random() * 2 + 1));
            currentHeartRate += change;
            currentHeartRate = Math.min(80, Math.max(60, currentHeartRate));
            let heartRateVal = Math.round(currentHeartRate + (Math.random() * 4 - 2));
            heartRateVal = Math.min(85, Math.max(60, heartRateVal));

            let hrEffect = (heartRateVal - 75) * 0.02 * (Math.random() - 0.5);
            dy += hrEffect;

            const angleRad = Math.atan2(-dy, dx);
            const angleDeg = parseFloat((angleRad * (180 / Math.PI)).toFixed(2));

            let initialSpeed = dx * 0.04;
            let posX = launcher.restX;
            let posY = launcher.restY;
            let vx = Math.cos(angleRad) * initialSpeed;
            let vy = Math.sin(angleRad) * initialSpeed;

            let isOutOfBounds = false;
            let frameCount = 0;

            return new Promise((resolve) => {
                function animate() {
                    const stepCount = isFast ? 10 : 1; 
                    for(let i = 0; i < stepCount; i++) {
                        frameCount++;
                        posX += vx * 10;
                        posY += vy * 10;

                        vx *= (1 - actualFriction);
                        vy *= (1 - actualFriction);

                        if (posY < 0 || posY > canvas.height) {
                            isOutOfBounds = true;
                            break;
                        }
                        if (Math.hypot(vx, vy) <= 0.01 || posX >= RINK_END_X) break;
                    }

                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    drawRink();

                    ctx.beginPath(); ctx.arc(posX, posY, launcher.stoneRadius, 0, Math.PI * 2);
                    ctx.fillStyle = '#800000'; ctx.fill();

                    if (Math.hypot(vx, vy) > 0.01 && posX < RINK_END_X && !isOutOfBounds) {
                        if (isFast) {
                            setTimeout(animate, 0);
                        } else {
                            requestAnimationFrame(animate);
                        }
                    } else {
                        trialCount++;
                        let distX = getDistanceFromX(posX);
                        let distDiag = getActualDistance(posX, posY);

                        const pxPerMM = (RINK_END_X - launcher.restX) / MAX_DISTANCE_MM;
                        let sideDeviation = (posY - launcher.restY) / pxPerMM;

                        let displayX = distX.toFixed(3);
                        let displayDiag = distDiag.toFixed(3);
                        let displayDev = sideDeviation.toFixed(3);

                        let distFromCenter = '測定不能';
                        if (displayX !== '測定不能' && displayDev !== '測定不能') {
                            const errorX = parseFloat(displayX) - 1700;
                            const errorY = parseFloat(displayDev);
                            distFromCenter = Math.hypot(errorX, errorY).toFixed(3);
                        }

                        let moveTimeSeconds = (frameCount * 0.045).toFixed(2);

                        const targetStartX = getXFromDistance(1600);
                        const targetEndX = getXFromDistance(1800);
                        
                        // 1,600mm 〜 1,800mm の帯に入っているかで成功判定
                        const isSuccess = (posX >= targetStartX && posX <= targetEndX && !isOutOfBounds) ? '成功' : '失敗';
                        
                        if (isSuccess === '成功') {
                            currentStreak++;
                        } else {
                            currentStreak = 0;
                        }
                        lastResult = isSuccess;

                        if (distDiag <= MAX_DISTANCE_MM && !isOutOfBounds) {
                            stoneHits.push({ x: posX, y: posY });
                        }

                        // 内部データ記録
                        historyData.push({
                            trial: trialCount,
                            force: actualPower,
                            angle: angleDeg,
                            noise: noise,
                            temp: temp,
                            humidity: humidity,
                            weight: weight,
                            friction: parseFloat(baseFriction.toFixed(5)),
                            heartRate: heartRateVal,
                            streak: currentStreak,
                            moveTime: parseFloat(moveTimeSeconds),
                            distanceX: displayX,
                            distanceDiag: displayDiag,
                            sideDev: displayDev,
                            distFromCenter: distFromCenter,
                            houseIn: isSuccess
                        });

                        dragX = launcher.restX; dragY = launcher.restY;
                        isAnimating = false;
                        drawRink();
                        resolve();
                    }
                }
                animate();
            });
        }

        async function runAutoSimulation() {
            if (isAnimating) return;
            const count = parseInt(document.getElementById('auto-count').value);
            const btn = document.getElementById('btn-run-auto');
            btn.disabled = true;
            btn.innerText = "実行中...";
        
            for (let i = 0; i < count; i++) {
                let dx;
                const chkForce = document.getElementById('chk-force');
                if (chkForce && chkForce.checked) {
                    const limitVal = parseFloat(document.getElementById('param-force').value);
                    dx = limitVal / 1.6;
                } else {
                    const minDx = 40 / 1.6;
                    const maxDx = 160 / 1.6;
                    dx = minDx + Math.random() * (maxDx - minDx);
                }
        
                let randomDy;
                const guideVal = 35;
                const maxYSpread = (guideVal / 50) * 12;
                randomDy = (Math.random() * 2 - 1) * maxYSpread;
        
                await shootStone(dx, randomDy, true);
            }
        
            btn.disabled = false;
            btn.innerText = "自動実行";
        }

        function resetData() {
            if (historyData.length > 0) {
                const isConfirmed = confirm(
                    `これまでの試行データ（${historyData.length}件）がすべて消去されます。\n本当にリセットしますか？`
                );
                if (!isConfirmed) {
                    return;
                }
            }

            trialCount = 0; 
            historyData = []; 
            stoneHits = [];
            currentHeartRate = 75;
            currentStreak = 0;
            lastResult = '成功';
            dragX = launcher.restX; 
            dragY = launcher.restY;
            drawRink();
        }

        // 初期化
        toggleParam('force');
        drawRink();
    </script>
</body>
</html>
