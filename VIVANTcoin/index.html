<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>コイン射撃シミュレーター</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f0f4f8; margin: 0; padding: 20px; color: #333; }
        h1 { font-size: 24px; margin-bottom: 10px; color: #1e3a8a; }
        
        .top-controls { background: white; padding: 15px 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 15px; display: flex; flex-wrap: wrap; gap: 15px 20px; align-items: center; }
        .control-item { display: flex; align-items: center; gap: 8px; }
        .control-item label { font-weight: bold; font-size: 13px; cursor: pointer; }
        .val-box { width: 65px; text-align: center; border: 1px solid #ccc; border-radius: 4px; padding: 3px; font-weight: bold; background: #f8fafc; font-size: 13px; }
        
        .simulation-container { display: flex; flex-direction: column; gap: 15px; }
        canvas { background-color: #a5b4fc; border: 2px solid #6366f1; border-radius: 8px; width: 100%; max-width: 1200px; height: 260px; display: block; cursor: crosshair; }
        
        .bottom-area { display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start; }
        .btn-group { display: flex; gap: 10px; }
        button { padding: 10px 20px; font-size: 14px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .btn-csv { background-color: #6366f1; color: white; }
        .btn-csv:hover { background-color: #4f46e5; }
        .btn-reset { background-color: #64748b; color: white; }
        .btn-reset:hover { background-color: #475569; }
        
        .table-container { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); width: 100%; max-width: 1000px; max-height: 250px; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: center; }
        th, td { padding: 6px 6px; border: 1px solid #cbd5e1; }
        th { background-color: #f1f5f9; font-weight: bold; position: sticky; top: 0; }
        
        .desc-box { background: #eff6ff; border-left: 4px solid #2563eb; padding: 10px 15px; border-radius: 4px; font-size: 13px; margin-bottom: 15px; }
        .disabled-input { opacity: 0.3; pointer-events: none; }
    </style>
</head>
<body>

    <h1>🥌 コイン射撃シミュレーター（探究学習版）</h1>
    
    <div class="desc-box">
        <strong>【遊び方】</strong><br>
        チェックボックスが外れている項目は、試行ごとに<strong>ランダムな値</strong>で変動します。<br>
        室温が高いと滑りやすく、コインが重いと摩擦が大きくなります。目標は1700mmのハウス中心です！
    </div>

    <!-- 設定パネル -->
    <div class="top-controls">
        <div class="control-item">
            <input type="checkbox" id="chk-force" onchange="toggleParam('force')">
            <label for="chk-force">引き量制限(mm)</label>
            <input type="range" id="param-force" min="40" max="160" value="120" oninput="updateVal('force')" class="disabled-input">
            <span id="val-force" class="val-box disabled-input">-</span>
        </div>

        <div class="control-item">
            <input type="checkbox" id="chk-guide" onchange="toggleParam('guide')">
            <label for="chk-guide">ガイド幅(cm)</label>
            <input type="range" id="param-guide" min="1" max="50" value="35" oninput="updateVal('guide')" class="disabled-input">
            <span id="val-guide" class="val-box disabled-input">-</span>
        </div>

        <div class="control-item">
            <input type="checkbox" id="chk-temp" onchange="toggleParam('temp')">
            <label for="chk-temp">🌡 室温(℃)</label>
            <input type="range" id="param-temp" min="0" max="30" value="15" step="1" oninput="updateVal('temp')" class="disabled-input">
            <span id="val-temp" class="val-box disabled-input">-</span>
        </div>

        <div class="control-item">
            <input type="checkbox" id="chk-weight" onchange="toggleParam('weight')">
            <label for="chk-weight">⚖ 重さ(g)</label>
            <input type="range" id="param-weight" min="5" max="30" value="15" step="1" oninput="updateVal('weight')" class="disabled-input">
            <span id="val-weight" class="val-box disabled-input">-</span>
        </div>

        <div class="control-item">
            <input type="checkbox" id="chk-fric" onchange="toggleParam('fric')">
            <label for="chk-fric">🧊 摩擦係数</label>
            <input type="range" id="param-fric" min="0.005" max="0.080" value="0.030" step="0.001" oninput="updateVal('fric')" class="disabled-input">
            <span id="val-fric" class="val-box disabled-input">-</span>
        </div>
    </div>

    <div class="simulation-container">
        <canvas id="canvas" width="1200" height="260"></canvas>
        
        <div class="bottom-area">
            <div class="btn-group">
                <button class="btn-csv" onclick="downloadCSV()">CSV出力(全13カラム)</button>
                <button class="btn-reset" onclick="resetData()">はじめから</button>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>試行ID</th>
                            <th>目標距離(mm)</th>
                            <th>引き量(mm)</th>
                            <th>引き量制限(mm)</th>
                            <th>ガイド幅(cm)</th>
                            <th>角度(°)</th>
                            <th>室温(℃)</th>
                            <th>重さ(g)</th>
                            <th>摩擦係数</th>
                            <th>到達[横](mm)</th>
                            <th>直線[斜め](mm)</th>
                            <th>横ズレ(mm)</th>
                            <th>成功判定</th>
                        </tr>
                    </thead>
                    <tbody id="data-table">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let trialCount = 0;
        let historyData = [];
        let stoneHits = [];

        const launcher = { x: 20, y: 50, width: 130, height: 160, stoneRadius: 10, restX: 130, restY: 130 };
        const MAX_DISTANCE_MM = 2300;
        const RINK_END_X = 1180;

        let isDragging = false;
        let dragX = launcher.restX;
        let dragY = launcher.restY;
        let isAnimating = false;

        function calcPowerFromDx(dx) { return Math.round(dx * 1.6); }
        function calcLimitXFromPower(power) { return launcher.restX - (power / 1.6); }

        function updateVal(param) {
            const chk = document.getElementById(`chk-${param}`);
            const el = document.getElementById(`param-${param}`);
            const valBox = document.getElementById(`val-${param}`);

            if (!chk.checked) {
                valBox.innerText = "-";
                return;
            }

            let unit = "";
            if(param === 'force') unit = "mm";
            if(param === 'guide') unit = "cm";
            if(param === 'temp') unit = "℃";
            if(param === 'weight') unit = "g";
            
            valBox.innerText = el.value + unit;
            drawRink();
        }

        function toggleParam(param) {
            const chk = document.getElementById(`chk-${param}`);
            const slider = document.getElementById(`param-${param}`);
            const valBox = document.getElementById(`val-${param}`);
            
            if (chk.checked) {
                slider.classList.remove('disabled-input');
                valBox.classList.remove('disabled-input');
                updateVal(param);
            } else {
                slider.classList.add('disabled-input');
                valBox.classList.add('disabled-input');
                valBox.innerText = "-";
            }
            drawRink();
        }

        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: (e.clientX - rect.left) * (canvas.width / rect.width),
                y: (e.clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        canvas.addEventListener('mousedown', (e) => {
            if (isAnimating) return;
            const mousePos = getMousePos(e);
            if (Math.hypot(mousePos.x - launcher.restX, mousePos.y - launcher.restY) < 25) {
                isDragging = true;
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDragging || isAnimating) return;
            const mousePos = getMousePos(e);

            let minX = launcher.x + 10;
            if (document.getElementById('chk-force').checked) {
                minX = Math.max(minX, calcLimitXFromPower(parseFloat(document.getElementById('param-force').value)));
            }

            dragX = Math.min(launcher.restX, Math.max(minX, mousePos.x));
            const isGuide = document.getElementById('chk-guide').checked;
            const guideVal = isGuide ? parseFloat(document.getElementById('param-guide').value) : 50;
            const maxYSpread = (guideVal - 1) / 49 * 60; 
            dragY = Math.min(launcher.restY + maxYSpread, Math.max(launcher.restY - maxYSpread, mousePos.y));

            drawRink();
        });

        window.addEventListener('mouseup', () => {
            if (isDragging) {
                isDragging = false;
                shootStone();
            }
        });

        function getXFromDistance(mm) { return launcher.restX + (mm * ((RINK_END_X - launcher.restX) / MAX_DISTANCE_MM)); }
        function getDistanceFromX(x) { return x < launcher.restX ? 0 : (x - launcher.restX) * (MAX_DISTANCE_MM / (RINK_END_X - launcher.restX)); }
        function getActualDistance(x, y) {
            const pxPerMM = (RINK_END_X - launcher.restX) / MAX_DISTANCE_MM;
            return Math.hypot(x - launcher.restX, (y - launcher.restY) * 2.2) / pxPerMM;
        }

        function drawRink() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#a5b4fc';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 目盛り
            ctx.strokeStyle = '#475569';
            ctx.fillStyle = '#0f172a';
            ctx.font = 'bold 11px sans-serif';
            for (let mm = 100; mm <= MAX_DISTANCE_MM; mm += 100) {
                const x = getXFromDistance(mm);
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
                if (mm % 200 === 0 || mm === 100) ctx.fillText(mm, x - 12, 15);
            }

            // ハウス（目標1700mm）
            const houseX = getXFromDistance(1700);
            const houseY = canvas.height / 2;
            const outerRadius = (RINK_END_X - launcher.restX) / (MAX_DISTANCE_MM / 100);

            ctx.beginPath(); ctx.arc(houseX, houseY, outerRadius, 0, Math.PI * 2); ctx.fillStyle = '#ef4444'; ctx.fill();
            ctx.beginPath(); ctx.arc(houseX, houseY, outerRadius * 0.66, 0, Math.PI * 2); ctx.fillStyle = '#ffffff'; ctx.fill();
            ctx.beginPath(); ctx.arc(houseX, houseY, outerRadius * 0.33, 0, Math.PI * 2); ctx.fillStyle = '#2563eb'; ctx.fill();

            // 発射台 & ガイド
            ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#475569'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.roundRect(launcher.x, launcher.y, launcher.width, launcher.height, 15); ctx.fill(); ctx.stroke();

            if (document.getElementById('chk-guide').checked) {
                const spread = (parseFloat(document.getElementById('param-guide').value) - 1) / 49 * 60;
                ctx.strokeStyle = '#2563eb'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(launcher.x, launcher.restY - spread); ctx.lineTo(launcher.x + launcher.width, launcher.restY - spread); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(launcher.x, launcher.restY + spread); ctx.lineTo(launcher.x + launcher.width, launcher.restY + spread); ctx.stroke();
            }

            if (document.getElementById('chk-force').checked) {
                const limitX = calcLimitXFromPower(parseFloat(document.getElementById('param-force').value));
                ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.moveTo(limitX, launcher.y + 5); ctx.lineTo(limitX, launcher.y + launcher.height - 5); ctx.stroke();
            }

            // コイン
            if (!isAnimating) {
                if (isDragging) {
                    ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 3;
                    ctx.beginPath(); ctx.moveTo(launcher.restX, launcher.restY); ctx.lineTo(dragX, dragY); ctx.stroke();
                }
                ctx.beginPath(); ctx.arc(dragX, dragY, launcher.stoneRadius, 0, Math.PI * 2);
                ctx.fillStyle = '#334155'; ctx.fill(); ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 2; ctx.stroke();
            }

            // 履歴
            stoneHits.forEach(stone => {
                if (stone.x <= canvas.width && stone.y >= 0 && stone.y <= canvas.height) {
                    ctx.beginPath(); ctx.arc(stone.x, stone.y, 8, 0, Math.PI * 2);
                    ctx.fillStyle = Math.hypot(stone.x - houseX, stone.y - houseY) <= outerRadius ? '#ef4444' : '#1e293b';
                    ctx.fill(); ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 1.5; ctx.stroke();
                }
            });
        }

        function shootStone() {
            isAnimating = true;

            const isGuide = document.getElementById('chk-guide').checked;
            const isForceLimit = document.getElementById('chk-force').checked;

            // チェックが無ければランダム生成（記録用）
            const temp = document.getElementById('chk-temp').checked 
                ? parseFloat(document.getElementById('param-temp').value)
                : Math.floor(Math.random() * 11) + 10; // 10〜20℃

            const weight = document.getElementById('chk-weight').checked 
                ? parseFloat(document.getElementById('param-weight').value)
                : Math.floor(Math.random() * 11) + 10; // 10〜20g

            // 摩擦係数：固定値指定があればそれを優先、無ければ室温と重さから計算
            let baseFriction = document.getElementById('chk-fric').checked
                ? parseFloat(document.getElementById('param-fric').value)
                : 0.045 - (temp * 0.001) + (weight * 0.0005);
            
            baseFriction = Math.max(0.005, baseFriction);

            const dx = launcher.restX - dragX;
            const dy = dragY - launcher.restY;
            const actualPower = calcPowerFromDx(dx);

            const angleRad = Math.atan2(-dy, dx);
            const angleDeg = parseFloat((angleRad * (180 / Math.PI)).toFixed(2));

            let initialSpeed = dx * 0.04;
            let posX = launcher.restX;
            let posY = launcher.restY;
            let vx = Math.cos(angleRad) * initialSpeed;
            let vy = Math.sin(angleRad) * initialSpeed;

            let isOutOfBounds = false;

            function animate() {
                posX += vx * 10;
                posY += vy * 10;

                vx *= (1 - baseFriction);
                vy *= (1 - baseFriction);

                if (posY < 0 || posY > canvas.height) isOutOfBounds = true;

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                drawRink();

                ctx.beginPath(); ctx.arc(posX, posY, launcher.stoneRadius, 0, Math.PI * 2);
                ctx.fillStyle = '#800000'; ctx.fill();

                if (Math.hypot(vx, vy) > 0.01 && posX < RINK_END_X && !isOutOfBounds) {
                    requestAnimationFrame(animate);
                } else {
                    trialCount++;
                    let distX = getDistanceFromX(posX);
                    let distDiag = getActualDistance(posX, posY);

                    let displayX = distX.toFixed(3);
                    let displayDiag = distDiag.toFixed(3);
                    let diffDist = (distDiag - distX).toFixed(3);

                    const houseX = getXFromDistance(1700);
                    const houseY = canvas.height / 2;
                    const pxPer100mm = (RINK_END_X - launcher.restX) / (MAX_DISTANCE_MM / 100);
                    
                    // 成功判定（"成功" または "失敗"）
                    const isSuccess = (Math.hypot(posX - houseX, posY - houseY) <= pxPer100mm) ? '成功' : '失敗';

                    if (distDiag > MAX_DISTANCE_MM || isOutOfBounds) {
                        displayX = 'NA'; displayDiag = 'NA'; diffDist = 'NA';
                    } else {
                        stoneHits.push({ x: posX, y: posY });
                    }

                    const record = {
                        trial: trialCount,
                        target: 1700,
                        force: actualPower,
                        forceLimit: isForceLimit ? parseFloat(document.getElementById('param-force').value) : 0,
                        guide: isGuide ? parseFloat(document.getElementById('param-guide').value) : 50,
                        angle: angleDeg,
                        temp: temp,
                        weight: weight,
                        friction: baseFriction.toFixed(4),
                        distanceX: displayX,
                        distanceDiag: displayDiag,
                        diffDist: diffDist,
                        houseIn: isSuccess
                    };
                    historyData.push(record);

                    // テーブル更新（画面表示とCSVの項目・順番を統一）
                    const tbody = document.getElementById('data-table');
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${record.trial}</td>
                        <td>${record.target}</td>
                        <td>${record.force}</td>
                        <td>${record.forceLimit}</td>
                        <td>${record.guide}</td>
                        <td>${record.angle}</td>
                        <td>${record.temp}</td>
                        <td>${record.weight}</td>
                        <td>${record.friction}</td>
                        <td><strong style="${displayX === 'NA' ? 'color:#ef4444;' : ''}">${record.distanceX}</strong></td>
                        <td><strong style="${displayDiag === 'NA' ? 'color:#ef4444;' : ''}">${record.distanceDiag}</strong></td>
                        <td>${record.diffDist}</td>
                        <td>${record.houseIn}</td>
                    `;
                    tbody.insertBefore(tr, tbody.firstChild);

                    dragX = launcher.restX; dragY = launcher.restY;
                    isAnimating = false;
                    drawRink();
                }
            }
            animate();
        }

        function resetData() {
            trialCount = 0; historyData = []; stoneHits = [];
            dragX = launcher.restX; dragY = launcher.restY;
            document.getElementById('data-table').innerHTML = '';
            drawRink();
        }

        function downloadCSV() {
            if (historyData.length === 0) return alert('データがありません。');
            let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
            csvContent += "試行ID,目標距離(mm),引き量(mm),引き量制限(mm),ガイド幅(cm),角度(°),室温(℃),コイン重さ(g),摩擦係数,到達距離_横(mm),直線距離_斜め(mm),横ズレ(mm),ハウスイン判定\n";

            historyData.forEach(r => {
                csvContent += `${r.trial},${r.target},${r.force},${r.forceLimit},${r.guide},${r.angle},${r.temp},${r.weight},${r.friction},${r.distanceX},${r.distanceDiag},${r.diffDist},${r.houseIn}\n`;
            });

            const link = document.createElement("a");
            link.setAttribute("href", encodeURI(csvContent));
            link.setAttribute("download", "coin_shooting_inquiry_data.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // 初期化
        ['force', 'guide', 'temp', 'weight', 'fric'].forEach(p => toggleParam(p));
        drawRink();
    </script>
</body>
</html>
