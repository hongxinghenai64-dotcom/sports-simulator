<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>コイン射撃シミュレーター | ポータル</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Helvetica Neue', Arial, sans-serif; 
            background-color: #f4fafd; 
            margin: 0; 
            padding: 40px 20px; 
            color: #2c3e50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: white;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(28, 163, 168, 0.08);
            text-align: center;
        }

        h1 {
            font-size: 26px;
            color: #167e88;
            margin-bottom: 10px;
        }

        p.subtitle {
            font-size: 14px;
            color: #618a90;
            margin-bottom: 35px;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .card {
            background: #ffffff;
            border: 2px solid #e2f1f3;
            border-radius: 16px;
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.3s ease;
        }

        .card:hover {
            border-color: #29c2c1;
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(41, 194, 193, 0.15);
        }

        .card h2 {
            font-size: 18px;
            color: #17656d;
            margin-top: 0;
            margin-bottom: 12px;
        }

        .card p {
            font-size: 13px;
            color: #55797d;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        /* 画像のUIに合わせたターコイズ・カプセルスタイルのボタン */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            padding: 12px 28px;
            border-radius: 50px; /* 完全な角丸カプセル */
            font-weight: bold;
            font-size: 14px;
            color: white;
            background-color: #72cfcb; /* Normal ボタンの配色 */
            box-shadow: 0 4px 10px rgba(114, 207, 203, 0.3);
            transition: all 0.25s ease;
            letter-spacing: 0.5px;
        }

        /* Hover & Focus 状態（画像中央左の光るFocus/Active表現） */
        .btn:hover {
            background-color: #26c6da;
            box-shadow: 0 0 16px rgba(38, 198, 218, 0.6);
            transform: scale(1.03);
        }

        /* Active 状態 */
        .btn:active {
            background-color: #12828e;
            box-shadow: 0 2px 6px rgba(18, 130, 142, 0.4);
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>回帰分析シミュレーター</h1>
        <p class="subtitle">データ分析学習用ポータルサイト</p>

        <div class="card-grid">
            <!-- 1. 固定なしモード -->
            <div class="card">
                <div>
                    <h2>データ取得用</h2>
                    <p>データを取得するためのシミュレーター</p>
                </div>
                <a href="./simulator-none.html" class="btn">シミュレーターを開く</a>
            </div>

            <!-- 2. 単一固定モード -->
            <div class="card">
                <div>
                    <h2>単回帰分析用</h2>
                    <p>単回帰分析の結果検証用シミュレーター</p>
                </div>
                <a href="./simulator-one.html" class="btn">シミュレーターを開く</a>
            </div>

            <!-- 3. 全固定モード -->
            <div class="card">
                <div>
                    <h2>重回帰分析用</h2>
                    <p>重回帰分析の結果検証用シミュレーター</p>
                </div>
                <a href="./simulator-all.html" class="btn">シミュレーターを開く</a>
            </div>
        </div>
    </div>

</body>
</html>
